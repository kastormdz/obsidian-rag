name: obsidian-rag
version: 0.3.1
manifest_version: 2
description: >-
  Hybrid search and note CRUD over an Obsidian vault, with obsn as the engine.
  No Python dependencies: every tool runs the obsn binary.
author: kastormdz
license: MIT
homepage: https://github.com/kastormdz/obsidian-rag
tags: [obsidian, notes, rag, search, vault]
provides_tools:
  - vault_search
  - vault_read
  - vault_write
  - vault_list
  - vault_move
  - vault_delete
  - vault_status
provides_hooks:
  - pre_tool_call
provides_skills:
  - vault
config_schema:
  obsn:
    type: str
    default: ""
    description: >-
      Path to the obsn binary. Empty = look it up in PATH.
  vault:
    type: str
    default: ""
    description: >-
      Vault folder (the one that contains .obsidian/). Empty = OBS_RAG_VAULT from
      the environment, or obsidian-rag's default.
  timeout:
    type: int
    default: 30
    description: Maximum seconds per obsn call.
